<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Aniversários</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
      }
      h1 {
        color: #333;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        max-width: 700px;
      }
      ul {
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Lista de Aniversários</h1>
      <ul>
        <li>Ana — 12/03</li>
        <li>Bruno — 27/06</li>
        <li>Carla — 04/09</li>
      </ul>
    </div>
  </body>
</html>
